[project]
name = "expert-commentary-service"
version = "1.0.0"
description = "An AI-powered clinical expert commentary generator for proficiency testing and laboratory EQA schemes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.124.4",
    "openai>=3.36.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter handles code line length; prompt text and field descriptions stay as long strings
ignore = ["E501"]
