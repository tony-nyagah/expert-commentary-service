[project]
name = "expert-commentary-service"
version = "0.1.0"
description = "An AI-powered clinical expert commentary generator for proficiency testing and laboratory EQA schemes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.124.4",
    "openai>=3.36.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

