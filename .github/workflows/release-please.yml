name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Keeps a release PR open that bumps pyproject.toml, uv.lock and CHANGELOG.md from the
      # conventional commits on main. Merging it tags vX.Y.Z and creates the GitHub release.
      - id: release
        uses: googleapis/release-please-action@v4

  # A tag pushed with GITHUB_TOKEN doesn't start other workflows, so the release tag can't
  # trigger image.yml. Build the versioned image here instead.
  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      packages: write
